macros:
  - name: cents_to_dollars
    description: converts a column from cents to dollars, defaults to 2dp unless user specifies the number of decimal places needed
    arguments:
      - name: column_name
        type: string
        description: the name of the column you want to convert
      - name: decimals
        type: integer
        description: number of decimal places, defaults to 2 if no number is specified
  - name: grant_select
    description: A macro that grants select privileges on traget.schema to target.role unless otherwise specified
    arguments:
      - name: schema 
        type: string
        description: schema we want to grant privileges on, by default is our target schema 
      - name: role
        type: string
        description: role we want to grant privileges on, by default is our target role